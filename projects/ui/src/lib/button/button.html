<button
  class="button"
  [attr.type]="type()"
  [attr.data-variant]="variant()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [disabled]="disabled() && !loading()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <span class="spinner" aria-hidden="true"></span>
  }
  <ng-content />
</button>
