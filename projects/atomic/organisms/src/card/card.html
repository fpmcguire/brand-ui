<article
  class="card"
  [attr.data-interactive]="interactive() ? '' : null"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  @if (loading()) {
    <bui-loading-skeleton />
    <span class="visually-hidden">Loading</span>
  } @else {
    <bui-media-area [label]="mediaLabel()" [tag]="tag()" />
    <div class="body">
      <h3 class="title">
        @if (interactive()) {
          <a class="link" [href]="href()">{{ title() }}</a>
        } @else {
          {{ title() }}
        }
      </h3>
      @if (description(); as description) {
        <p class="text">{{ description }}</p>
      }
      @if (codeSample(); as codeSample) {
        <bui-code-well>{{ codeSample }}</bui-code-well>
      }
      @if (meta(); as meta) {
        <p class="meta">{{ meta }}</p>
      }
    </div>
  }
</article>
